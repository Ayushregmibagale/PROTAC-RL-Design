# REINVENT4 staged learning — Link-INVENT for DDR2 PROTAC linker design
#
# Reference: DDR2 rank2 MD (100 ns, 75.5% bridging)
# Fragments:  warhead (Foretinib-based, 36 HA) + VHL ligand (VH032-based, 30 HA)
# Existing linker: O-CCC-O-CCC-O-CCC=O  →  FragmentEffectiveLength = 11 bonds
# Target range: [8, 14] bonds  (±3 slack around 11)
#
# Run:
#   conda activate reinvent4
#   cd ~/REINVENT
#   reinvent -l outputs/ddr2_run.log configs/linkinvent_ddr2.toml

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "/home/ayushregmibagale/PROTAC-RL-Design/outputs/tb_ddr2"
json_out_config = "/home/ayushregmibagale/PROTAC-RL-Design/outputs/ddr2_run_config.json"

[parameters]
# Transformer prior (PubChem-trained, better generalisation than RNN prior)
prior_file = "/home/ayushregmibagale/PROTAC-RL-Design/models/linkinvent_transformer_pubchem.prior"
agent_file = "/home/ayushregmibagale/PROTAC-RL-Design/models/linkinvent_transformer_pubchem.prior"
smiles_file = "/home/ayushregmibagale/PROTAC-RL-Design/1_generate/inputs/ddr2_fragments.smi"

summary_csv_prefix = "/home/ayushregmibagale/PROTAC-RL-Design/outputs/ddr2_rl"
batch_size = 64
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

# ── Single stage — run for up to 500 steps ────────────────────────────────────
[[stage]]
chkpt_file = "/home/ayushregmibagale/PROTAC-RL-Design/outputs/ddr2_stage1.chkpt"
termination = "simple"
max_score = 0.75
min_steps = 50
max_steps = 500

[stage.scoring]
type = "geometric_mean"

# 1. Linker effective length — PRIMARY DDR2 CONSTRAINT
#    SJF8240 linker = 11 bonds (effective_length).
#    Step score: 1.0 inside [8,14], 0.0 outside.
[[stage.scoring.component]]
[stage.scoring.component.FragmentEffectiveLength]
[[stage.scoring.component.FragmentEffectiveLength.endpoint]]
name = "Linker length [8-14 bonds]"
weight = 0.35
transform.type = "step"
transform.low = 8
transform.high = 14

# 2. Full PROTAC molecular weight
#    SJF8240 = 1106 Da; target 850–1150 Da
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "MW 850-1150"
weight = 0.20
transform.type = "double_sigmoid"
transform.low = 850.0
transform.high = 1150.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# 3. LogP — SJF8240 = 8.07; allow 1–9
[[stage.scoring.component]]
[stage.scoring.component.SlogP]
[[stage.scoring.component.SlogP.endpoint]]
name = "SlogP 1-9"
weight = 0.15
transform.type = "double_sigmoid"
transform.low = 1.0
transform.high = 9.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# 4. TPSA — SJF8240 = 234 Å²; allow 100–250
[[stage.scoring.component]]
[stage.scoring.component.TPSA]
[[stage.scoring.component.TPSA.endpoint]]
name = "TPSA 100-250"
weight = 0.10
transform.type = "double_sigmoid"
transform.low = 100.0
transform.high = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# 5. HBond donors — SJF8240 = 4; keep ≤ 5
[[stage.scoring.component]]
[stage.scoring.component.HBondDonors]
[[stage.scoring.component.HBondDonors.endpoint]]
name = "HBD <= 5"
weight = 0.10
transform.type = "reverse_sigmoid"
transform.high = 5.0
transform.low = 3.0
transform.k = 0.5

# 6. Rotatable bonds — SJF8240 = 25; penalise > 28
[[stage.scoring.component]]
[stage.scoring.component.NumRotBond]
[[stage.scoring.component.NumRotBond.endpoint]]
name = "RotBonds <= 28"
weight = 0.10
transform.type = "reverse_sigmoid"
transform.high = 28.0
transform.low = 20.0
transform.k = 0.5
